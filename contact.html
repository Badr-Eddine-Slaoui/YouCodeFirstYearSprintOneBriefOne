<!DOCTYPE html>
<html lang="en">
<head>
<title>Contact Us</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Badr Eddine Slaoui">
<meta name="title" content="Contact Us">
<meta name="description" content="Contact us to learn more about us, or to join our band">
<meta name="keywords" content="Contact, Band, Music">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato">
<link rel="stylesheet" href="./style/style.css">
<link rel="stylesheet" href="./style/contact.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
body {font-family: "Lato", sans-serif}
.mySlides {display: none}
</style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
  <div class="logo">
    <img src="w3images/logo.webp" alt="Brand Logo">
  </div>
  <div class="links">
    <a class="link-item" href="./index.html">HOME</a>
    <a class="link-item" href="./band.html">BAND</a>
    <a class="link-item" href="./tour.html">TOUR</a>
    <a class="link-item active" href="./contact.html">CONTACT</a>
  </div>
</div>

<!-- Page content -->
<div class="w3-content" style="max-width:2000px;margin-top:46px">


  <!-- The Contact Section -->
  <div id="contact">
    <h2>CONTACT</h2>
    <p class="contact-text"><i>Fan? Drop a note!</i></p>
    <div class="contact-container">
      <div class="contact-info">
        <div class="contact-item">
          <i class="contact-icon fa fa-map-marker"></i>
          <p>Chicago, US</p>
        </div>
        <div class="contact-item">
          <i class="contact-icon fa fa-phone"></i>
          <p>Phone: +00 151515</p>
        </div>
        <div class="contact-item">
          <i class="contact-icon fa fa-envelope"></i>
          <p>Email: mail@mail.com</p>
        </div>
      </div>
      <form class="contact-form">
          <div>
            <div class="contact-form-row">
              <label for="name">Name:</label>
              <input type="text" placeholder="Name" required name="Name">
            </div>
            <div class="contact-form-row">
              <label for="email">Email:</label>
              <input type="email" placeholder="Email" required name="Email">
            </div>
          </div>
          <div class="contact-form-row">
            <label for="message">Message:</label>
            <textarea name="Message" id="message" placeholder="Message"></textarea>
          </div>
          <button type="submit">SEND</button>
        </form>
    </div>
  </div>
  
<!-- End Page Content -->
</div>

<!-- Image of location/map -->
<img class="map" src="w3images/map.jpg">

<!-- Footer -->
<footer>
  <div class="social-media">
    <i class="icon fa fa-facebook-official"></i>
    <i class="icon fa fa-instagram"></i>
    <i class="icon fa fa-snapchat"></i>
    <i class="icon fa fa-pinterest-p"></i>
    <i class="icon fa fa-twitter"></i>
    <i class="icon fa fa-linkedin"></i>
  </div>
  <p>Powered by Badr Eddine Slaoui</a></p>
</footer>

</body>
</html>
